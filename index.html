          (last ? "See final scores " + ICON.spark : "Next round " + ICON.arrow) + "</button>" +
        (S.stepIndex > 0 ? '<button class="btn btn-ghost" data-prev>Back</button>' : "") +
        '<span class="hintline"><kbd>Enter</kbd> to advance</span>' +
      "</div>" +
    "</section>";

  wireScoring(app, cat);
}

function pnHTML(p) {
  return '<div class="pn"><i class="dot" style="color:' + p.color + ";background:" + p.color +
    '"></i><span>' + esc(p.name) + "</span></div>";
}

function wireScoring(app, cat) {
  const rows = $(".srows", app);

  const setSimple = (i, val) => {
    if (cat.kind === "tiebreak") { S.tiebreak[i] = val; save(); return; }
    S.simple[cat.id] = S.simple[cat.id] || {};
    S.simple[cat.id][i] = val;
    save();
    const el = rows.querySelector('[data-sum="' + i + '"]');
    if (el && cat.per && cat.per !== 1) el.innerHTML = "= <b>" + (val * cat.per) + "</b> pts";
  };

  rows.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.v !== undefined) {
      setSimple(Number(t.dataset.v), clamp(Math.floor(Number(t.value) || 0), 0, 999));
    } else if (t.dataset.r !== undefined) {
      const [pi, ri] = t.dataset.r.split("|").map(Number);
      S.goals[pi] = S.goals[pi] || [0, 0, 0, 0];
      S.goals[pi][ri] = clamp(Math.floor(Number(t.value) || 0), 0, 99);
      save();
      const el = rows.querySelector('[data-sum="' + pi + '"]');
      if (el) el.innerHTML = "= <b>" + catScore(cat, pi) + "</b> pts";
    } else if (t.dataset.n !== undefined) {
      const [pi, hid] = t.dataset.n.split("|");
      S.nectar[pi] = S.nectar[pi] || {};
      S.nectar[pi][hid] = clamp(Math.floor(Number(t.value) || 0), 0, 99);
      save();
      const np = nectarPoints();
      $$("[data-nb]", rows).forEach(b => { b.textContent = (np[Number(b.dataset.nb)] || 0) + " pts"; });
    }
  });

  rows.addEventListener("blur", e => {
    if (e.target.tagName === "INPUT" && e.target.value === "") e.target.value = "0";
  }, true);

  // Grid spinners reuse the input handler above by re-dispatching, so the state
  // and derived displays stay in exactly one place.
  const bump = (inp, d, max) => {
    inp.value = clamp((Number(inp.value) || 0) + d, 0, max);
    inp.dispatchEvent(new Event("input", { bubbles: true }));
  };

  rows.addEventListener("click", e => {
    const b = e.target.closest("[data-step]");
    if (b) {
      const [i, d] = b.dataset.step.split("|").map(Number);
      const inp = rows.querySelector('[data-v="' + i + '"]');
      const val = clamp((Number(inp.value) || 0) + d, 0, cat.kind === "tiebreak" ? 99 : 999);
      inp.value = val;
      setSimple(i, val);
      return;
    }
    const rb = e.target.closest("[data-rstep]");
    if (rb) {
      const parts = rb.dataset.rstep.split("|");
      bump(rows.querySelector('[data-r="' + parts[0] + "|" + parts[1] + '"]'), Number(parts[2]), 99);
      return;
    }
    const nb = e.target.closest("[data-nstep]");
    if (nb) {
      const parts = nb.dataset.nstep.split("|");
      bump(rows.querySelector('[data-n="' + parts[0] + "|" + parts[1] + '"]'), Number(parts[2]), 99);
    }
  });

  const cats = scoringSteps();
  const go = d => {
    const n = S.stepIndex + d;
    if (n < 0) return;
    if (n >= cats.length) { startReveal(); return; }
    S.stepIndex = n;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  $("[data-next]", app).onclick = () => go(1);
  const prev = $("[data-prev]", app);
  if (prev) prev.onclick = () => go(-1);

  app.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); go(1); }
  };

  const first = rows.querySelector("input");
  if (first && matchMedia("(pointer:fine)").matches) { first.focus(); first.select(); }
}

function startReveal() {
  S.phase = "reveal";
  S.revealPlayed = false;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================================
   RENDER — reveal
   ========================================================================= */

let revealTimers = [];
let revealRAF = null;

function stopReveal() {
  revealTimers.forEach(clearTimeout);
  revealTimers = [];
  if (revealRAF) cancelAnimationFrame(revealRAF);
  revealRAF = null;
  // a replay can start while the last run's confetti is still falling
  $$("#confetti").forEach(c => c.remove());
}

function renderReveal(app) {
  stopReveal();

  const cats    = categories();
  const players = activePlayers();
  const seg     = players.map(p => cats.map(c => catScore(c, p.i)));
  const totals  = seg.map(a => a.reduce((x, y) => x + y, 0));
  const scaleMax = Math.max(1, Math.max.apply(null, totals)) * 1.04;

  app.innerHTML =
    '<section class="screen reveal-wrap">' +
      '<p class="eyebrow">The reveal</p>' +
      '<div class="cat-head" id="catHead"><span class="ch-dot"></span>' +
        '<span class="ch-txt"><b id="chName">Tallying</b><i id="chRule">Stand by</i></span></div>' +

      '<div class="chart" id="chart">' + players.map(p =>
        '<div class="crow" data-p="' + p.i + '">' +
          '<div class="cname"><span class="rank" data-rank="' + p.i + '"></span>' +
            '<i class="dot" style="color:' + p.color + ";background:" + p.color + '"></i>' +
            "<span>" + esc(p.name) + "</span></div>" +
          '<div class="track"><div class="segs">' + cats.map(c =>
            '<div class="seg" data-seg="' + p.i + "|" + c.id + '" style="background:' + c.color + '"></div>'
          ).join("") + "</div>" +
            '<div class="ticks" data-ticks></div>' +
            '<span class="head" data-head="' + p.i + '" style="color:' + p.color + ";background:" + p.color + '"></span>' +
            '<span class="add" data-add="' + p.i + '" style="color:' + p.color + '"></span>' +
          "</div>" +
          '<div class="tail-col">' +
            '<div class="insp" data-insp="' + p.i + '"></div>' +
            '<div class="ctotal" data-tot="' + p.i + '">0</div>' +
            '<span class="tiebadge" data-tb="' + p.i + '">' + ICON.seed + '<span>0</span></span>' +
          "</div>" +
        "</div>"
      ).join("") + "</div>" +

      '<div class="legend" id="legend">' + cats.map(c =>
        '<button class="lg" data-lg="' + c.id + '"><i style="background:' + c.color + '"></i>' + esc(c.short) + "</button>"
      ).join("") + "</div>" +
      '<p class="insp-hint" id="inspHint" hidden></p>' +

      '<button class="skip" id="skipBtn">Skip animation</button>' +
      '<button class="skip replay" id="replayBtn" hidden>' + ICON.again + "Replay the reveal</button>" +

      '<div class="results-tail" id="tail">' +
        podiumHTML() +
        '<p class="eyebrow" style="margin-top:6px">Score breakdown</p>' +
        tableHTML() +
        '<div class="actions">' +
          '<button class="btn btn-primary" id="dlCsv">' + ICON.down + "Download results</button>" +
          '<button class="btn btn-ghost" id="dlPng">' + ICON.cam + "Capture podium</button>" +
          '<button class="btn btn-danger" id="newGameBtn">' + ICON.again + "Play new game</button>" +
        "</div>" +
        '<div class="lockbar" style="margin-top:20px">' + ICON.lock +
          "<span>Nothing is uploaded or stored &mdash; this game lives in this browser tab only.</span></div>" +
      "</div>" +
    "</section>";

  const rowEls = {}, totEls = {}, rankEls = {}, headEls = {}, addEls = {};
  players.forEach(p => {
    rowEls[p.i]  = app.querySelector('.crow[data-p="' + p.i + '"]');
    totEls[p.i]  = app.querySelector('[data-tot="' + p.i + '"]');
    rankEls[p.i] = app.querySelector('[data-rank="' + p.i + '"]');
    headEls[p.i] = app.querySelector('[data-head="' + p.i + '"]');
    addEls[p.i]  = app.querySelector('[data-add="' + p.i + '"]');
  });
  const segEls = players.map((p, pi) => cats.map(c => app.querySelector('[data-seg="' + p.i + "|" + c.id + '"]')));

  // One faint division per point, but only while a point is wide enough to read.
  const RATE  = 5;     // points per second — every bar advances at this same rate
  const HOLD  = 1000;  // pause at the end of each category
  const EMPTY = 450;   // how long to show a category nobody scored in

  const trackW = app.querySelector(".track").clientWidth || 520;
  const pointW = trackW / scaleMax;
  if (pointW >= 3.5) {
    const g = "repeating-linear-gradient(90deg,transparent 0," +
      "transparent " + (pointW - 1).toFixed(2) + "px," +
      "rgba(0,0,0,.30) " + (pointW - 1).toFixed(2) + "px," +
      "rgba(0,0,0,.30) " + pointW.toFixed(2) + "px)";
    $$("[data-ticks]", app).forEach(t => { t.style.backgroundImage = g; });
  }

  function setCatHead(cat) {
    const h = $("#catHead", app);
    $("#chName", app).textContent = cat ? cat.name : "Final scores";
    $("#chRule", app).textContent = cat ? (cat.rule || "") : "All categories counted";
    const col = cat ? cat.color : "#fbbf24";
    h.querySelector(".ch-dot").style.background = col;
    h.querySelector(".ch-dot").style.boxShadow = "0 0 16px " + col;
    h.style.borderColor = cat ? col + "66" : "rgba(251,191,36,.5)";
    h.style.boxShadow = "0 0 34px -12px " + col;
  }

  /** Park the travelling marker and its +N chip at `frac` along the track. */
  function setHead(pi, frac, add, visible) {
    const pct = clamp(frac, 0, 1) * 100;
    const h = headEls[players[pi].i], a = addEls[players[pi].i];
    h.style.left = pct + "%";
    h.style.opacity = visible ? "1" : "0";
    a.style.left = pct + "%";
    a.textContent = "+" + add;
    // Flip the chip back over the bar once the marker nears the right edge.
    a.style.transform = frac > 0.72
      ? "translate(calc(-100% - 14px),-50%)"
      : "translate(14px,-50%)";
    a.style.opacity = visible ? "1" : "0";
  }
  function hideHeads() {
    players.forEach(p => { headEls[p.i].style.opacity = "0"; addEls[p.i].style.opacity = "0"; });
  }

  function markLead() {
    let best = -1, leaders = [];
    players.forEach(p => {
      const v = Number(totEls[p.i].textContent) || 0;
      if (v > best) { best = v; leaders = [p.i]; }
      else if (v === best) leaders.push(p.i);
    });
    players.forEach(p => rowEls[p.i].classList.toggle("lead", best > 0 && leaders.indexOf(p.i) >= 0));
  }

  /** FLIP the chart rows into the given order. */
  function reorderTo(order) {
    const chart = $("#chart", app);
    const rows = $$(".crow", chart);
    const before = new Map(rows.map(r => [r, r.getBoundingClientRect().top]));
    order.forEach(r => chart.appendChild(rowEls[r.i]));
    rows.forEach(r => {
      const d = before.get(r) - r.getBoundingClientRect().top;
      r.style.transition = "none";
      r.style.transform = d ? "translateY(" + d + "px)" : "";
    });
    void chart.offsetHeight;
    requestAnimationFrame(() => {
      rows.forEach(r => {
        r.style.transition = "transform .8s cubic-bezier(.16,1,.3,1)";
        r.style.transform = "";
      });
    });
  }

  /* ---- inspect: pull one category out of the finished stack ---- */
  let inspect = null;      // catId currently singled out
  let inspectable = false; // only once the reveal has landed
  let finalHead = null;    // header text to restore when clearing

  function applyInspect() {
    const c = inspect ? cats.find(x => x.id === inspect) : null;
    $("#chart", app).classList.toggle("inspecting", !!c);

    players.forEach((p, pi) => {
      cats.forEach((cc, ci) => segEls[pi][ci].classList.toggle("lit", !!c && cc.id === c.id));
      const box = app.querySelector('[data-insp="' + p.i + '"]');
      if (c) {
        box.textContent = catScore(c, p.i);
        box.style.color = c.color;
        box.classList.add("on");
      } else {
        box.classList.remove("on");
      }
    });

    $$(".lg", app).forEach(l => {
      const sel = !!c && l.dataset.lg === c.id;
      l.classList.toggle("sel", sel);
      l.style.background = sel ? c.color : "";
      l.style.borderColor = sel ? c.color : "";
      l.style.color = sel ? "var(--bg)" : "";
    });

    const hint = $("#inspHint", app);
    if (c) {
      setCatHead(c);
      hint.innerHTML = "Showing <b>" + esc(c.name) + "</b> &middot; tap it again for totals";
    } else {
      setCatHead(null);
      if (finalHead) {
        $("#chName", app).textContent = finalHead.n;
        $("#chRule", app).textContent = finalHead.r;
      }
      hint.innerHTML = "Tap a category to see everyone&rsquo;s points for it";
    }
  }

  $("#legend", app).onclick = e => {
    const b = e.target.closest("[data-lg]");
    if (!b || !inspectable) return;
    inspect = (inspect === b.dataset.lg) ? null : b.dataset.lg;
    applyInspect();
  };

  function enableInspect() {
    inspectable = true;
    finalHead = { n: $("#chName", app).textContent, r: $("#chRule", app).textContent };
    $$(".lg", app).forEach(l => l.classList.add("clickable"));
    const hint = $("#inspHint", app);
    hint.hidden = false;
    hint.innerHTML = "Tap a category to see everyone&rsquo;s points for it";
  }

  function setBadge(i, value, on) {
    const b = app.querySelector('[data-tb="' + i + '"]');
    b.querySelector("span").textContent = value;
    b.classList.toggle("on", !!on);
  }

  /** Freeze the bars at their final widths and clear the running-tally chrome. */
  function freezeBars() {
    players.forEach((p, pi) => {
      cats.forEach((c, ci) => { segEls[pi][ci].style.width = (seg[pi][ci] / scaleMax * 100) + "%"; });
      totEls[p.i].textContent = totals[pi];
      rowEls[p.i].classList.remove("lead");
    });
    hideHeads();
    $$(".lg", app).forEach(l => l.classList.remove("hot"));
    const sk = $("#skipBtn", app);
    if (sk) sk.remove();
    const rp = $("#replayBtn", app);
    if (rp) rp.hidden = false;
  }

  /** Land on the final order, crown the winner and bring in the podium. */
  function finishOrder(withConfetti) {
    const st = standings();
    const shared = sharedVictory();
    setCatHead(null);
    if (shared) {
      $("#chName", app).textContent = "Shared Victory";
      $("#chRule", app).textContent = "Level on points and on food";
    }
    reorderTo(st);
    st.forEach(r => {
      rankEls[r.i].textContent = r.rank;
      rankEls[r.i].style.opacity = ".75";
      rowEls[r.i].classList.remove("dim", "tiefocus");
      rowEls[r.i].classList.toggle("win", r.rank === 1);
      rowEls[r.i].classList.toggle("tiewin", !!r.wonTiebreak);
    });
    $("#tail", app).classList.add("show");
    enableInspect();
    if (withConfetti) confetti();
    S.revealPlayed = true;
    save();
  }

  /** The tiebreak beat: dim everyone else, count the tied players' food up, then re-sort. */
  function runTiebreak(groups, withConfetti) {
    const tied = groups.reduce((a, g) => a.concat(g), []);
    const isTied = i => tied.some(t => t.i === i);

    $("#chName", app).textContent = "Tiebreak";
    $("#chRule", app).textContent = "Most food left over";
    const h = $("#catHead", app);
    h.querySelector(".ch-dot").style.background = "#a3e635";
    h.querySelector(".ch-dot").style.boxShadow = "0 0 16px #a3e635";
    h.style.borderColor = "rgba(163,230,53,.5)";
    h.style.boxShadow = "0 0 34px -12px #a3e635";

    players.forEach(p => {
      rowEls[p.i].classList.toggle("dim", !isTied(p.i));
      rowEls[p.i].classList.toggle("tiefocus", isTied(p.i));
    });
    tied.forEach(t => setBadge(t.i, 0, true));

    const peak = Math.max.apply(null, tied.map(t => t.food));
    const dur = peak > 0 ? Math.max(700, (peak / RATE) * 1000) : 600;
    const t0 = performance.now();

    (function frame(now) {
      const t = clamp((now - t0) / dur, 0, 1);
      tied.forEach(r => setBadge(r.i, Math.round(Math.min(r.food, peak * t)), true));
      if (t < 1) { revealRAF = requestAnimationFrame(frame); return; }
      tied.forEach(r => setBadge(r.i, r.food, true));
      revealTimers.push(setTimeout(() => finishOrder(withConfetti), 1100));
    })(performance.now());
  }

  /**
   * End of the reveal. With `animate` the tiebreak plays as its own beat; without it
   * (skip, or a page refresh after the reveal) everything lands in its final state.
   */
  function settle(withConfetti, animate) {
    freezeBars();
    const byTotal = standingsByTotal();
    const groups = tieGroups(byTotal);
    groups.reduce((a, g) => a.concat(g), []).forEach(r => setBadge(r.i, r.food, true));

    if (!groups.length || animate === false) { finishOrder(withConfetti); return; }

    setCatHead(null);
    reorderTo(byTotal);
    byTotal.forEach((r, idx) => {
      rankEls[r.i].textContent = idx + 1;
      rankEls[r.i].style.opacity = ".4";
    });
    groups.reduce((a, g) => a.concat(g), []).forEach(r => setBadge(r.i, 0, true));
    revealTimers.push(setTimeout(() => runTiebreak(groups, withConfetti), 1000));
  }

  wireResultActions(app);

  // Clearing the played flag and re-rendering runs the whole sequence again,
  // tiebreak included, from a clean slate.
  $("#replayBtn", app).onclick = () => {
    S.revealPlayed = false;
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  if (S.revealPlayed) { settle(false, false); return; }

  /* ---- the suspenseful part ----
     Every bar advances at the same constant rate, so a player with more points in
     a category simply keeps moving after the others have stopped. Each category
     then holds for a beat before the next one starts. */
  let ci = 0;
  const running = players.map(() => 0);

  function stepCat() {
    if (ci >= cats.length) {
      revealTimers.push(setTimeout(() => settle(true, true), 600));
      return;
    }
    const cat = cats[ci], idx = ci;
    setCatHead(cat);
    $$(".lg", app).forEach(l => l.classList.toggle("hot", l.dataset.lg === cat.id));

    const peak = Math.max.apply(null, players.map((p, pi) => seg[pi][idx]));
    const dur  = peak > 0 ? (peak / RATE) * 1000 : EMPTY;

    players.forEach((p, pi) => setHead(pi, running[pi] / scaleMax, 0, seg[pi][idx] > 0));

    const t0 = performance.now();
    (function frame(now) {
      const t = clamp((now - t0) / dur, 0, 1);
      const front = peak * t;                       // points released so far this category
      players.forEach((p, pi) => {
        const v = seg[pi][idx];
        const got = Math.min(v, front);             // each player stops at their own value
        segEls[pi][idx].style.width = (got / scaleMax * 100) + "%";
        totEls[p.i].textContent = Math.round(running[pi] + got);
        setHead(pi, (running[pi] + got) / scaleMax, Math.round(got), v > 0);
      });
      markLead();
      if (t < 1) { revealRAF = requestAnimationFrame(frame); return; }

      players.forEach((p, pi) => {
        running[pi] += seg[pi][idx];
        totEls[p.i].textContent = running[pi];
        setHead(pi, running[pi] / scaleMax, seg[pi][idx], seg[pi][idx] > 0);
      });
      ci++;
      revealTimers.push(setTimeout(stepCat, HOLD));
    })(performance.now());
  }

  revealTimers.push(setTimeout(stepCat, 700));

  $("#skipBtn", app).onclick = () => { stopReveal(); settle(true, false); };
}

function podiumHTML() {
  const st = standings().slice(0, 3);
  const order = st.length >= 3 ? [st[1], st[0], st[2]] : [st[1], st[0]];
  return '<div class="podium">' + order.filter(Boolean).map(r => {
    const cls = r.rank === 1 ? "p1" : (r.rank === 2 ? "p2" : "p3");
    return '<div class="ped ' + cls + '">' +
      (r.rank === 1 ? '<div class="crown">&#128081;</div>' : "") +
      '<div class="who"><div class="nm" style="color:' + r.color + '">' + esc(r.name) + "</div>" +
        '<div class="sc">' + r.total + "<small>PTS</small></div></div>" +
      '<div class="block"><span class="pl">' + r.rank + "</span></div>" +
    "</div>";
  }).join("") + "</div>";
}

function tableHTML() {
  const cats = categories(), st = standings();
  // The food column only earns its place when a tie actually happened.
  const showFood = tieGroups(standingsByTotal()).length > 0;
  const ncols = cats.length + (showFood ? 1 : 0);
  return '<div class="table-scroll"><div class="table" style="--ncols:' + ncols + '">' +
    '<div class="th"><span>#</span><span>Player</span>' +
      cats.map(c => '<span style="text-align:center">' + esc(c.short) + "</span>").join("") +
      (showFood ? '<span style="text-align:center">Leftover</span>' : "") +
      '<span style="text-align:right">Total</span></div>' +
    st.map(r =>
      '<div class="tr ' + (r.rank === 1 ? "first" : "") + '">' +
        '<span class="rk">' + r.rank + "</span>" +
        '<span class="nm"><i style="background:' + r.color + '"></i><span>' + esc(r.name) + "</span></span>" +
        cats.map(c => { const v = catScore(c, r.i); return '<span class="v ' + (v ? "" : "z") + '">' + v + "</span>"; }).join("") +
        (showFood
          ? '<span class="v" style="color:' + (r.wonTiebreak ? "#a3e635" : "") + '">' + r.food + "</span>"
          : "") +
        '<span class="tt">' + r.total + "</span>" +
      "</div>"
    ).join("") +
  "</div></div>" +
  (showFood
    ? '<p class="hintline" style="margin-top:12px">' +
      (sharedVictory()
        ? "Level on points and on leftover food &mdash; a shared victory."
        : "Level on points, so leftover food decided it.") + "</p>"
    : "");
}

function wireResultActions(app) {
  $("#dlCsv", app).onclick = exportCSV;
  $("#dlPng", app).onclick = exportPNG;
  $("#newGameBtn", app).onclick = confirmNewGame;
}

/* ------------------------------------------------------------- confetti */

function confetti() {
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.id = "confetti";
  document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.width = innerWidth * dpr, h = cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  const ctx = cv.getContext("2d");
  const colors = ["#3ee8d0", "#a78bfa", "#fbbf24", "#fb7185", "#a3e635", "#ffffff"];
  const P = [];
  for (let i = 0; i < 150; i++) {
    P.push({
      x: w * (0.5 + (Math.random() - 0.5) * 0.55),
      y: h * 0.40,
      vx: (Math.random() - 0.5) * 16 * dpr,
      vy: (-Math.random() * 17 - 4) * dpr,
      s: (4 + Math.random() * 7) * dpr,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.34,
      c: colors[i % colors.length], life: 1
    });
  }
  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(34, now - last) / 16.7; last = now;
    ctx.clearRect(0, 0, w, h);
    let alive = false;
    for (const p of P) {
      if (p.life <= 0) continue;
      p.vy += 0.44 * dpr * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.r += p.vr * dt; p.life -= 0.0072 * dt;
      if (p.y > h + 50) { p.life = 0; continue; }
      alive = true;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
      ctx.restore();
    }
    if (alive) requestAnimationFrame(loop); else cv.remove();
  })(last);
}

/* ============================================================================
   EXPORT
   ========================================================================= */

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function csvCell(v) {
  v = String(v);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function exportCSV() {
  const cats = categories(), st = standings();
  const L = [];
  L.push(["Wingspan Scorekeeper"].map(csvCell).join(","));
  L.push(["Date", new Date().toLocaleString()].map(csvCell).join(","));
  L.push(["Expansions", expansionSummary()].map(csvCell).join(","));
  L.push(["House rules", houseRuleSummary()].map(csvCell).join(","));
  L.push(["Players", S.playerCount].map(csvCell).join(","));
  L.push("");
  L.push(["Rank", "Player"].concat(cats.map(c => c.name),
    ["Total", "Leftover food (tiebreak)", "Won on tiebreak"]).map(csvCell).join(","));
  st.forEach(r => {
    L.push([r.rank, r.name].concat(cats.map(c => catScore(c, r.i)),
      [r.total, r.food, r.wonTiebreak ? "yes" : ""]).map(csvCell).join(","));
  });
  downloadBlob(new Blob(["﻿" + L.join("\r\n")], { type: "text/csv;charset=utf-8" }),
               "wingspan-" + stamp() + ".csv");
  toast("Results downloaded");
}

/* ---- podium poster ---- */

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function trackedWidth(ctx, text, sp) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + sp;
  return w - sp;
}
function tracked(ctx, text, x, y, sp) {
  let cx = x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
}

const FONT = 'ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

function exportPNG() {
  const cats = categories(), st = standings();
  const DPR = 2, W = 1400, PAD = 72;
  const podTop = 210, podBase = 600;
  const listTop = podBase + 110;
  const rowH = 54;
  const legendTop = listTop + 34 + st.length * rowH + 42;
  const H = legendTop + 96;

  const cv = document.createElement("canvas");
  cv.width = W * DPR; cv.height = H * DPR;
  const ctx = cv.getContext("2d");
  ctx.scale(DPR, DPR);
  ctx.textBaseline = "alphabetic";

  /* background */
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#05070e"); bg.addColorStop(0.55, "#0a1020"); bg.addColorStop(1, "#070a14");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  [["#3ee8d0", 120, 40, 460, 0.16], ["#a78bfa", W - 140, 10, 440, 0.15], ["#fb923c", W * 0.55, H - 60, 520, 0.09]]
    .forEach(([c, x, y, r, a]) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    });

  /* header */
  ctx.fillStyle = "#3ee8d0";
  ctx.font = "650 13px " + FONT;
  tracked(ctx, "WINGSPAN SCOREKEEPER", PAD, 64, 5.5);
  ctx.fillStyle = "#e9eef8";
  ctx.font = "700 48px " + FONT;
  ctx.fillText("Final Standings", PAD, 120);
  ctx.fillStyle = "#8d99b2";
  ctx.font = "400 16px " + FONT;
  ctx.fillText(new Date().toLocaleString() + "   ·   " + expansionSummary() +
               "   ·   " + S.playerCount + " players", PAD, 150);
  if (S.custom.length) {
    ctx.fillStyle = "#5b667e";
    ctx.font = "400 14px " + FONT;
    ctx.fillText("House rules: " + houseRuleSummary(), PAD, 174);
  }
  ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, 192); ctx.lineTo(W - PAD, 192); ctx.stroke();

  /* podium */
  const top3 = st.slice(0, 3);
  const order = top3.length >= 3 ? [top3[1], top3[0], top3[2]] : [top3[1], top3[0]];
  const peds = order.filter(Boolean);
  const pw = 250, gap = 34;
  const totalW = peds.length * pw + (peds.length - 1) * gap;
  let px = (W - totalW) / 2;
  const HGT = { 1: 205, 2: 148, 3: 108 };
  const TINT = { 1: [251, 191, 36], 2: [226, 232, 240], 3: [251, 146, 60] };

  peds.forEach(r => {
    const h = HGT[r.rank] || 90;
    const tint = TINT[r.rank] || [148, 163, 184];
    const y = podBase - h;

    const g = ctx.createLinearGradient(0, y, 0, podBase);
    g.addColorStop(0, "rgba(" + tint.join(",") + ",.62)");
    g.addColorStop(.55, "rgba(" + tint.join(",") + ",.22)");
    g.addColorStop(1, "rgba(" + tint.join(",") + ",.04)");
    ctx.fillStyle = g;
    rr(ctx, px, y, pw, h, 16); ctx.fill();
    ctx.strokeStyle = "rgba(" + tint.join(",") + ",.7)"; ctx.lineWidth = 1.4;
    rr(ctx, px + 0.7, y + 0.7, pw - 1.4, h - 1.4, 15); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillRect(px + 16, y + 1.5, pw - 32, 1.2);

    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.font = "800 44px " + FONT; ctx.textAlign = "center";
    ctx.fillText(String(r.rank), px + pw / 2, y + h / 2 + 16);

    ctx.fillStyle = r.color;
    ctx.font = "650 20px " + FONT;
    let nm = r.name;
    while (ctx.measureText(nm).width > pw - 18 && nm.length > 3) nm = nm.slice(0, -1);
    if (nm !== r.name) nm = nm.slice(0, -1) + "…";
    ctx.fillText(nm, px + pw / 2, y - 46);

    ctx.fillStyle = "#e9eef8";
    ctx.font = "750 40px " + FONT;
    const sTxt = String(r.total);
    const sW = ctx.measureText(sTxt).width;
    ctx.textAlign = "left";
    ctx.fillText(sTxt, px + pw / 2 - (sW + 34) / 2, y - 12);
    ctx.fillStyle = "#5b667e"; ctx.font = "650 12px " + FONT;
    tracked(ctx, "PTS", px + pw / 2 - (sW + 34) / 2 + sW + 8, y - 12, 1.5);
    ctx.textAlign = "center";

    if (r.rank === 1) {
      ctx.font = "30px " + FONT;
      ctx.fillText("👑", px + pw / 2, y - 84);
    }
    if (r.wonTiebreak) {
      ctx.fillStyle = "#a3e635";
      ctx.font = "650 11px " + FONT;
      const lbl = "TIEBREAK · " + r.food + " FOOD";
      tracked(ctx, lbl, px + pw / 2 - trackedWidth(ctx, lbl, 2) / 2, podBase + 26, 2);
    }
    px += pw + gap;
  });
  ctx.textAlign = "left";

  if (sharedVictory()) {
    ctx.fillStyle = "#a3e635";
    ctx.font = "650 12px " + FONT;
    const lbl = "SHARED VICTORY · LEVEL ON POINTS AND FOOD";
    tracked(ctx, lbl, W / 2 - trackedWidth(ctx, lbl, 3) / 2, podBase + 26, 3);
  }

  /* breakdown list */
  ctx.fillStyle = "#5b667e"; ctx.font = "650 12px " + FONT;
  tracked(ctx, "SCORE BREAKDOWN", PAD, listTop, 4.5);

  const barX = 380, barW = W - PAD - 120 - barX, barH = 28;
  const maxTotal = Math.max(1, st[0] ? st[0].total : 1);
  st.forEach((r, i) => {
    const y = listTop + 34 + i * rowH;
    const cy = y + barH / 2;

    ctx.fillStyle = r.rank === 1 ? "#fbbf24" : "#5b667e";
    ctx.font = "700 15px " + FONT;
    ctx.fillText(String(r.rank), PAD, cy + 5);

    ctx.fillStyle = r.color;
    ctx.beginPath(); ctx.arc(PAD + 34, cy, 5.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#e9eef8"; ctx.font = "600 17px " + FONT;
    let nm = r.name;
    while (ctx.measureText(nm).width > barX - PAD - 70 && nm.length > 3) nm = nm.slice(0, -1);
    if (nm !== r.name) nm += "…";
    ctx.fillText(nm, PAD + 50, cy + 6);

    ctx.fillStyle = "rgba(255,255,255,.05)";
    rr(ctx, barX, y, barW, barH, 9); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.09)"; ctx.lineWidth = 1;
    rr(ctx, barX + .5, y + .5, barW - 1, barH - 1, 9); ctx.stroke();

    ctx.save();
    rr(ctx, barX, y, barW, barH, 9); ctx.clip();
    let cx = barX;
    cats.forEach(c => {
      const v = catScore(c, r.i);
      if (v <= 0) return;
      const w = v / maxTotal * barW;
      ctx.fillStyle = c.color;
      ctx.fillRect(cx, y, w, barH);
      ctx.fillStyle = "rgba(255,255,255,.18)";
      ctx.fillRect(cx, y, w, 1.5);
      cx += w;
    });
    ctx.restore();

    ctx.fillStyle = r.rank === 1 ? "#fbbf24" : "#e9eef8";
    ctx.font = "750 22px " + FONT; ctx.textAlign = "right";
    ctx.fillText(String(r.total), W - PAD, cy + 8);
    ctx.textAlign = "left";
  });

  /* legend */
  ctx.fillStyle = "#5b667e"; ctx.font = "650 12px " + FONT;
  tracked(ctx, "CATEGORIES", PAD, legendTop, 4.5);
  let lx = PAD, ly = legendTop + 28;
  ctx.font = "500 14px " + FONT;
  cats.forEach(c => {
    const label = c.short;
    const w = 16 + ctx.measureText(label).width + 22;
    if (lx + w > W - PAD) { lx = PAD; ly += 26; }
    ctx.fillStyle = c.color;
    rr(ctx, lx, ly - 9, 10, 10, 3); ctx.fill();
    ctx.fillStyle = "#8d99b2";
    ctx.fillText(label, lx + 16, ly);
    lx += w;
  });

  ctx.fillStyle = "#3b4356"; ctx.font = "400 12px " + FONT;
  ctx.textAlign = "right";
  ctx.fillText("Scored offline · no data stored", W - PAD, H - 26);
  ctx.textAlign = "left";

  cv.toBlob(b => {
    downloadBlob(b, "wingspan-podium-" + stamp() + ".png");
    toast("Podium image saved");
  }, "image/png");
}

/* ============================================================================
   BOOT
   ========================================================================= */

S = load() || blankState();
$("#newGameTop").onclick = confirmNewGame;
render();
</script>
