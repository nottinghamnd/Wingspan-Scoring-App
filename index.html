<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Wingspan Scorekeeper</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#04060c;
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.20);
  --txt:#e9eef8;
  --muted:#8d99b2;
  --dim:#5b667e;

  --cyan:#3ee8d0;
  --violet:#a78bfa;
  --amber:#fbbf24;
  --egg:#e7edfb;
  --rose:#fb7185;
  --blue:#60a5fa;
  --orange:#fb923c;
  --lime:#a3e635;

  --r-sm:10px; --r:16px; --r-lg:22px;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --maxw:1080px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
  font:400 15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
::selection{background:rgba(62,232,208,.28)}

/* ============================================================
   BACKDROP
   ============================================================ */
.aurora{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.aurora span{position:absolute;display:block;border-radius:50%;filter:blur(100px);will-change:transform}
.a1{width:62vw;height:62vw;left:-18vw;top:-26vw;background:radial-gradient(circle,rgba(62,232,208,.30),transparent 68%);animation:drift1 26s var(--ease-io) infinite}
.a2{width:56vw;height:56vw;right:-16vw;top:-14vw;background:radial-gradient(circle,rgba(167,139,250,.28),transparent 68%);animation:drift2 32s var(--ease-io) infinite}
.a3{width:70vw;height:52vw;left:22vw;bottom:-34vw;background:radial-gradient(circle,rgba(251,146,60,.16),transparent 70%);animation:drift3 38s var(--ease-io) infinite}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vw,0) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-7vw,7vw,0) scale(.92)}}
@keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-5vw,-4vw,0) scale(1.15)}}
.grid-bg{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(ellipse 100% 76% at 50% 0%,#000 12%,transparent 78%);
          mask-image:radial-gradient(ellipse 100% 76% at 50% 0%,#000 12%,transparent 78%);
}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%)}

/* ============================================================
   CHROME
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:18px;
  padding:14px clamp(16px,4vw,34px);
  background:linear-gradient(180deg,rgba(4,6,12,.94),rgba(4,6,12,.6) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand svg{width:30px;height:30px;filter:drop-shadow(0 0 12px rgba(62,232,208,.5))}
.brand b{font-size:15px;font-weight:650;letter-spacing:.22em;text-transform:uppercase}
.brand i{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.20em;text-transform:uppercase;
  padding-left:11px;margin-left:2px;border-left:1px solid var(--line)}
.topbar{flex-wrap:wrap;row-gap:12px}
.topbar .spacer{flex:1;order:1}
.topbar .ghost-btn{order:2}
.rail{order:3;flex-basis:100%}
.rail:empty{display:none}
.ghost-btn{
  padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:12.5px;font-weight:550;letter-spacing:.06em;
  transition:.28s var(--ease);white-space:nowrap;
}
.ghost-btn:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel)}

main{max-width:var(--maxw);margin:0 auto;padding:8px clamp(16px,4vw,34px) 90px}

/* ============================================================
   TYPE
   ============================================================ */
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:11px;font-weight:650;letter-spacing:.26em;text-transform:uppercase;color:var(--cyan);
  margin:0 0 14px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan))}
h1{margin:0 0 10px;font-size:clamp(28px,5.2vw,44px);line-height:1.06;font-weight:620;letter-spacing:-.028em}
h1 .accent{background:linear-gradient(96deg,var(--cyan),var(--violet) 65%,var(--orange));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 30px;color:var(--muted);font-size:15.5px;max-width:62ch}

.screen{animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ============================================================
   SETUP STEPPER
   ============================================================ */
.setup-rail{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.setup-rail .s{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);
  letter-spacing:.12em;text-transform:uppercase;font-weight:600;background:none;padding:0}
.setup-rail .s .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);font-size:11px;transition:.3s var(--ease)}
.setup-rail .s.on{color:var(--txt)}
.setup-rail .s.on .n{background:var(--cyan);color:#03110f;border-color:var(--cyan);box-shadow:0 0 18px rgba(62,232,208,.45)}
.setup-rail .s.done .n{background:rgba(62,232,208,.16);border-color:rgba(62,232,208,.5);color:var(--cyan)}
.setup-rail .bar{flex:0 0 26px;height:1px;background:var(--line)}

/* ============================================================
   CARDS / PANELS
   ============================================================ */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:clamp(18px,3vw,26px);
}
.cards{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tcard{
  position:relative;text-align:left;padding:19px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);
  transition:.34s var(--ease);overflow:hidden;
}
.tcard:hover{border-color:var(--line-2);transform:translateY(-2px);background:var(--panel-2)}
.tcard.on{border-color:rgba(62,232,208,.55);background:rgba(62,232,208,.075);
  box-shadow:0 0 0 1px rgba(62,232,208,.18),0 14px 40px -18px rgba(62,232,208,.5)}
.tcard .tn{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}
.tcard .tn b{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.tcard .td{font-size:13px;color:var(--muted);line-height:1.5}
.tcard .flag{display:inline-block;margin-top:11px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--orange);background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.3);
  padding:3px 8px;border-radius:999px;font-weight:650}
.check{width:22px;height:22px;border-radius:7px;border:1px solid var(--line-2);flex:0 0 auto;
  display:grid;place-items:center;transition:.3s var(--ease)}
.check svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.3s var(--ease);stroke:#03110f}
.tcard.on .check{background:var(--cyan);border-color:var(--cyan)}
.tcard.on .check svg{opacity:1;transform:none}

.note{
  display:flex;gap:11px;align-items:flex-start;margin-top:18px;padding:13px 15px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.028);
  font-size:13px;color:var(--muted);line-height:1.55;
}
.note svg{flex:0 0 auto;width:15px;height:15px;margin-top:2px;stroke:var(--dim);fill:none}
.note b{color:var(--txt);font-weight:600}

/* ============================================================
   ACTIONS
   ============================================================ */
.actions{display:flex;gap:12px;align-items:center;margin-top:30px;flex-wrap:wrap}
.btn{
  position:relative;padding:13px 26px;border-radius:999px;font-size:14.5px;font-weight:600;
  transition:.3s var(--ease);white-space:nowrap;display:inline-flex;align-items:center;gap:9px;
}
.btn svg{width:16px;height:16px;fill:none}
.btn-primary{background:linear-gradient(96deg,var(--cyan),#6ee7d8 45%,var(--violet));color:#03110f;
  box-shadow:0 12px 34px -14px rgba(62,232,208,.85)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 44px -14px rgba(62,232,208,.95)}
.btn-primary:disabled{opacity:.35;pointer-events:none;box-shadow:none}
.btn-ghost{border:1px solid var(--line);color:var(--muted)}
.btn-ghost:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel)}
.btn-danger{border:1px solid rgba(251,113,133,.4);color:var(--rose);background:rgba(251,113,133,.08)}
.btn-danger:hover{background:rgba(251,113,133,.16);border-color:rgba(251,113,133,.65)}
.hintline{font-size:12.5px;color:var(--dim)}
kbd{font:inherit;font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--muted)}

/* ============================================================
   PLAYERS
   ============================================================ */
.pills{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.pill{padding:11px 21px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
  font-weight:600;font-size:15px;transition:.3s var(--ease);font-variant-numeric:tabular-nums}
.pill:hover{color:var(--txt);border-color:var(--line-2)}
.pill.on{background:var(--txt);color:#04060c;border-color:var(--txt)}
.plist{display:grid;gap:11px}
.prow{display:flex;align-items:center;gap:13px;padding:11px 15px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel);transition:.3s var(--ease)}
.prow:focus-within{border-color:var(--line-2);background:var(--panel-2)}
.swatch{width:32px;height:32px;border-radius:50%;flex:0 0 auto;position:relative;transition:.3s var(--ease)}
.swatch:hover{transform:scale(1.1)}
.swatch::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;opacity:.32}
.prow input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;font-weight:500;padding:6px 0}
.prow input::placeholder{color:var(--dim)}
.prow .idx{font-size:11px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-weight:650}

/* ============================================================
   HOUSE RULES
   ============================================================ */
.hr-list{display:grid;gap:11px;margin-bottom:16px}
.hr-item{display:flex;align-items:flex-start;gap:14px;padding:15px 17px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel)}
.hr-item .hb{flex:1;min-width:0}
.hr-item .hb b{display:block;font-size:15.5px;font-weight:600;margin-bottom:3px}
.hr-item .hb span{font-size:13px;color:var(--muted)}
.hr-del{color:var(--dim);padding:5px;border-radius:8px;transition:.25s}
.hr-del:hover{color:var(--rose);background:rgba(251,113,133,.1)}
.hr-del svg{width:15px;height:15px;fill:none;stroke:currentColor}

.hr-form{display:grid;gap:13px;padding:19px;border-radius:var(--r);
  border:1px dashed var(--line-2);background:rgba(255,255,255,.022)}
.field{display:grid;gap:6px}
.field label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:650}
.field input,.field select{
  padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:rgba(0,0,0,.28);outline:none;font-size:15px;transition:.25s;width:100%;
}
.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,232,208,.13)}
.field select option{background:#0b1020;color:var(--txt)}
.f2{display:grid;gap:13px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
.empty-hr{text-align:center;padding:30px 18px;color:var(--dim);font-size:14px;
  border:1px dashed var(--line);border-radius:var(--r);margin-bottom:16px}

/* ============================================================
   SCORING
   ============================================================ */
.rail{display:flex;gap:6px;align-items:center;overflow-x:auto;order:3;flex:0 0 100%;
  scrollbar-width:none;padding:2px 0}
.rail::-webkit-scrollbar{display:none}
.rail button{
  flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid transparent;
  transition:.3s var(--ease);white-space:nowrap;
}
.rail button:hover:not(:disabled){color:var(--muted)}
.rail button:disabled{cursor:default}
.rail button.done{color:var(--muted)}
.rail button.on{color:#03110f;background:var(--cyan);box-shadow:0 0 20px rgba(62,232,208,.4)}

.scorehead{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.stepno{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:650;
  font-variant-numeric:tabular-nums}
.catdot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:10px;vertical-align:middle}

.srows{display:grid;gap:11px}
.srow{
  display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel);transition:.3s var(--ease);
}
.srow:focus-within{border-color:var(--line-2);background:var(--panel-2)}
.srow .pn{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.srow .pn .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 12px currentColor}
.srow .pn span{font-size:16px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stepper{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.stepper button{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line);color:var(--muted);
  font-size:19px;line-height:1;display:grid;place-items:center;transition:.22s var(--ease);
}
.stepper button:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}
.stepper button:active{transform:scale(.9)}
.stepper input{
  width:72px;height:38px;text-align:center;border-radius:11px;border:1px solid var(--line);
  background:rgba(0,0,0,.3);outline:none;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;
  transition:.25s;
}
.stepper input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,232,208,.13)}
.stepper .quick{
  width:auto;min-width:42px;padding:0 11px;font-size:12.5px;font-weight:650;
  letter-spacing:.01em;color:var(--dim);margin-left:2px;
}
.stepper .quick:hover{color:var(--cyan);border-color:rgba(62,232,208,.45);background:rgba(62,232,208,.09)}
@media(max-width:520px){.stepper .quick{min-width:38px;padding:0 8px;font-size:11.5px}}

.pts{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:64px;text-align:right;
  flex:0 0 auto}
.pts b{color:var(--cyan);font-weight:650}

/* goal-board place-point reference */
.goalref{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:-18px 0 26px}
.goalref .grl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:650;margin-right:3px}
.goalref .gr{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.goalref .gr b{color:var(--amber);font-weight:650;letter-spacing:.02em}

/* rounds grid */
.srow.rounds{flex-wrap:wrap}
.srow.stack{flex-direction:column;align-items:stretch;gap:13px}
.srow.stack .srow-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.srow.stack .pts{text-align:right}
.srow.stack .rcell input{width:46px}
.rgrid{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.rcell{display:grid;gap:5px;justify-items:center}
.rcell label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:650}
.rcell input{width:58px;height:38px;text-align:center;border-radius:11px;border:1px solid var(--line);
  background:rgba(0,0,0,.3);outline:none;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;transition:.25s}
.rcell input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.13)}

/* compact spinner for the dense grids — a stacked +/- beside each cell */
.rspin{display:flex;align-items:stretch;gap:3px}
.rbtns{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.rbtns button{
  width:22px;flex:1;border-radius:6px;border:1px solid var(--line);color:var(--dim);
  font-size:11px;line-height:1;display:grid;place-items:center;transition:.2s var(--ease);padding:0;
}
.rbtns button:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}
.rbtns button:active{transform:scale(.88)}

/* nectar grid */
.ncell label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:650}
.ncell input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(251,146,60,.13)}
.nectar-badge{font-size:12.5px;padding:5px 11px;border-radius:999px;font-weight:650;
  border:1px solid rgba(251,146,60,.3);background:rgba(251,146,60,.1);color:var(--orange);
  font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:60px;text-align:center}

.lockbar{
  display:flex;align-items:center;gap:9px;margin-top:22px;font-size:12.5px;color:var(--dim);
}
.lockbar svg{width:14px;height:14px;stroke:var(--dim);fill:none}

/* ============================================================
   REVEAL
   ============================================================ */
.reveal-wrap{padding-top:6px}
/* category header tab */
.cat-head{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:max-content;min-width:min(300px,100%);max-width:100%;
  margin:0 auto 34px;padding:13px 30px;border-radius:15px;
  border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .45s var(--ease),box-shadow .45s var(--ease);
}
.cat-head .ch-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--cyan);
  transition:background .45s var(--ease),box-shadow .45s var(--ease)}
.cat-head .ch-txt{text-align:center;min-width:0}
.cat-head b{display:block;font-size:16px;font-weight:650;letter-spacing:.18em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-head i{display:block;font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.16em;
  text-transform:uppercase;margin-top:4px;font-weight:600}

.chart{display:grid;gap:14px;margin-bottom:26px}
.crow{display:grid;grid-template-columns:minmax(96px,152px) 1fr minmax(62px,auto);gap:16px;align-items:center;
  will-change:transform;transition:opacity .55s var(--ease),filter .55s var(--ease)}
/* On a phone the row stacks so the bar gets the full width — the breakdown
   segments are otherwise too narrow to tell apart. */
@media(max-width:640px){
  .chart{gap:22px}
  .crow{grid-template-columns:1fr auto;grid-template-areas:"nm tot" "tk tk";gap:9px 12px;align-items:center}
  .crow .cname{grid-area:nm}
  .crow .tail-col{grid-area:tot;flex-direction:row;align-items:baseline;gap:10px}
  .crow .track{grid-area:tk;height:44px}
  .crow .cname span{font-size:16px}
  .ctotal{font-size:21px}
}
.crow.dim{opacity:.26;filter:saturate(.35)}
.crow.tiefocus .track{box-shadow:0 0 0 1px rgba(163,230,53,.55),0 0 32px -8px rgba(163,230,53,.75)}

.tail-col{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tiebadge{
  display:none;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  color:var(--lime);border:1px solid rgba(163,230,53,.42);background:rgba(163,230,53,.11);
  animation:rise .45s var(--ease) both;
}
.tiebadge.on{display:inline-flex}

.crow.tiewin .tiebadge{color:#04060c;background:var(--lime);border-color:var(--lime);
  box-shadow:0 0 18px -2px rgba(163,230,53,.8)}
.crow .cname{display:flex;align-items:center;gap:9px;min-width:0}
.crow .cname .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 12px currentColor}
.crow .cname span{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cname .rank{font-size:11px;color:var(--dim);font-weight:700;width:18px;flex:0 0 auto;
  font-variant-numeric:tabular-nums;opacity:0;transition:.4s var(--ease)}
.track{position:relative;height:38px;border-radius:10px;background:rgba(255,255,255,.045);
  border:1px solid var(--line)}
.segs{display:flex;height:100%;width:100%;border-radius:9px;overflow:hidden}
.seg{height:100%;width:0;position:relative;flex:0 0 auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  transition:opacity .35s var(--ease),filter .35s var(--ease)}

/* inspect mode — one category pulled out of the stack */
.chart.inspecting .seg{opacity:.18;filter:saturate(.35)}
.chart.inspecting .seg.lit{opacity:1;filter:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 0 20px rgba(255,255,255,.22)}
.chart.inspecting .ctotal{font-size:14px;color:var(--dim);font-weight:600}
.chart.inspecting .ticks{opacity:.16}
.ticks{transition:opacity .35s var(--ease)}
.insp{display:none;text-align:right;font-size:23px;font-weight:750;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1;animation:rise .35s var(--ease) both}
.insp.on{display:block}
.insp-hint{margin:15px 0 0;font-size:12.5px;color:var(--dim)}
.insp-hint b{color:var(--muted);font-weight:650}
.lg{cursor:default}
.lg.clickable{cursor:pointer}
.lg.clickable:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel-2);transform:translateY(-1px)}
.lg.sel{font-weight:700;transform:none}
@media(max-width:640px){
  .insp{font-size:21px}
  .chart.inspecting .ctotal{font-size:13px}
}
/* one faint division per point, drawn only when a point is wide enough to read */
.ticks{position:absolute;inset:0;border-radius:9px;pointer-events:none;opacity:.5}

/* travelling marker + running increment, mirroring the official app's leading token */
.head{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;
  transform:translate(-50%,-50%);z-index:2;opacity:0;
  box-shadow:0 0 0 3px rgba(4,6,12,.85),0 0 16px 2px currentColor}

  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;
  padding:3px 9px;border-radius:999px;border:1px solid currentColor;
  background:rgba(4,6,12,.86);box-shadow:0 3px 14px rgba(0,0,0,.6)}
.ctotal{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;
  letter-spacing:-.02em;transition:color .4s}
.crow.lead .ctotal{color:var(--cyan);text-shadow:0 0 22px rgba(62,232,208,.55)}
.crow.win .track{box-shadow:0 0 0 1px rgba(251,191,36,.55),0 0 36px -6px rgba(251,191,36,.6)}
.crow.win .cname span{color:var(--amber)}

.legend{display:flex;flex-wrap:wrap;gap:8px}
.lg{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);font-size:12px;color:var(--muted);transition:.3s var(--ease);
  font-variant-numeric:tabular-nums}
.lg i{width:9px;height:9px;border-radius:3px;display:block}
.lg.hot{color:var(--txt);border-color:var(--line-2);background:var(--panel-2);transform:translateY(-1px)}

.skip{display:inline-flex;align-items:center;gap:8px;
  margin-top:22px;font-size:12px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);padding:7px 15px;border-radius:999px;transition:.3s var(--ease)}
.skip:hover{color:var(--muted);border-color:var(--line-2)}
.skip svg{width:13px;height:13px;fill:none;stroke:currentColor}
.skip.replay:hover{color:var(--cyan);border-color:rgba(62,232,208,.45);background:rgba(62,232,208,.08)}
.skip.replay:hover svg{transform:rotate(-180deg)}
.skip.replay svg{transition:transform .5s var(--ease)}

#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ============================================================
   PODIUM
   ============================================================ */
.results-tail{opacity:0;transform:translateY(20px);transition:.8s var(--ease);pointer-events:none}
.results-tail.show{opacity:1;transform:none;pointer-events:auto}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.6vw,24px);
  margin:44px 0 34px;min-height:250px}
.ped{display:flex;flex-direction:column;align-items:center;gap:0;flex:0 1 190px;min-width:0;max-width:200px}
.ped .who{text-align:center;margin-bottom:13px;width:100%}
.ped .who .nm{font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px}
.ped .who .sc{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.ped .who .sc small{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.14em;margin-left:5px}
.ped .crown{font-size:26px;margin-bottom:7px;filter:drop-shadow(0 0 16px rgba(251,191,36,.7));
  animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ped .block{
  width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;
  border:1px solid var(--line-2);position:relative;overflow:hidden;
}
.ped .block .pl{font-size:38px;font-weight:800;opacity:.32;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.ped.p1 .block{height:154px;background:linear-gradient(180deg,rgba(251,191,36,.34),rgba(251,191,36,.05));
  border-color:rgba(251,191,36,.5);box-shadow:0 0 50px -12px rgba(251,191,36,.6)}
.ped.p2 .block{height:112px;background:linear-gradient(180deg,rgba(226,232,240,.26),rgba(226,232,240,.04));
  border-color:rgba(226,232,240,.34)}
.ped.p3 .block{height:82px;background:linear-gradient(180deg,rgba(251,146,60,.24),rgba(251,146,60,.04));
  border-color:rgba(251,146,60,.34)}

.table{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.table .th,.table .tr{display:grid;align-items:center;gap:10px;padding:12px 18px;
  grid-template-columns:34px minmax(90px,1.5fr) repeat(var(--ncols),minmax(46px,1fr)) 66px}
.table .th{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:650;
  background:rgba(255,255,255,.035);border-bottom:1px solid var(--line)}
.table .tr{border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums;font-size:14.5px}
.table .tr:last-child{border-bottom:0}
.table .tr .rk{font-weight:700;color:var(--dim)}
.table .tr.first .rk{color:var(--amber)}
.table .tr .nm{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.table .tr .nm i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.table .tr .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table .tr .v{text-align:center;color:var(--muted)}
.table .tr .v.z{color:var(--dim);opacity:.45}
.table .tr .tt{text-align:right;font-weight:750;font-size:17px}
.table-scroll{overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.table-scroll::-webkit-scrollbar{height:8px}
.table-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.table-scroll .table{min-width:100%;width:max-content}
.table .th,.table .tr{grid-template-columns:34px minmax(104px,1fr) repeat(var(--ncols),minmax(58px,auto)) 70px}

/* ============================================================
   MODAL
   ============================================================ */
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:22px;
  background:rgba(2,4,9,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:fade .28s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{
  width:min(460px,100%);border-radius:var(--r-lg);padding:30px;
  background:linear-gradient(165deg,rgba(22,28,45,.97),rgba(10,14,26,.97));
  border:1px solid var(--line-2);box-shadow:0 40px 90px -28px rgba(0,0,0,.9);
  animation:pop .4s var(--ease);
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.dialog .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:17px;
  background:rgba(251,113,133,.13);border:1px solid rgba(251,113,133,.32)}
.dialog .ic svg{width:22px;height:22px;stroke:var(--rose);fill:none}
.dialog h3{margin:0 0 9px;font-size:21px;font-weight:640;letter-spacing:-.02em}
.dialog p{margin:0 0 24px;color:var(--muted);font-size:14.5px;line-height:1.6}
.dialog .row{display:flex;gap:11px;justify-content:flex-end;flex-wrap:wrap}

.toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);z-index:90;
  padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:550;
  background:rgba(16,22,38,.96);border:1px solid var(--line-2);
  box-shadow:0 18px 44px -16px rgba(0,0,0,.85);opacity:0;transition:.42s var(--ease);
  display:flex;align-items:center;gap:9px;
}
.toast svg{width:15px;height:15px;stroke:var(--cyan);fill:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.05s!important}
  .aurora span{animation:none}
}

<body>
<div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="grid-bg"></div>
<div class="vignette"></div>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M3 20c6.5 1.5 11-1 14.5-6C21 9 25 6.5 29 6c-1 5.5-3.5 9.5-7.5 12.5C17 22 10.5 24.5 3 20Z"
            fill="url(#wg)"/>
      <path d="M8.5 23.5c4.5.8 8.5-.8 11.5-4" stroke="#0b1020" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
      <defs><linearGradient id="wg" x1="3" y1="20" x2="29" y2="6">
        <stop stop-color="#3ee8d0"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb923c"/>
      </linearGradient></defs>
    </svg>
    <b>Wingspan</b><i>Scorekeeper</i>
  </div>
  <div class="rail" id="rail"></div>
  <div class="spacer"></div>
  <button class="ghost-btn" id="newGameTop" hidden>New game</button>
</header>

<main id="app"></main>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============================================================================
   Wingspan Scorekeeper — single file, no dependencies, no network, no database.
   Game state lives in sessionStorage only (cleared when the tab closes).
   ========================================================================= */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  info:  '<svg viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg>',
  lock:  '<svg viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  trash: '<svg viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l.8 12.2a1.8 1.8 0 0 0 1.8 1.8h5.8a1.8 1.8 0 0 0 1.8-1.8L18.5 7"/></svg>',
  warn:  '<svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.7 21.2 19H2.8L12 3.7Z"/><path d="M12 10v4.4M12 17.3v.2"/></svg>',
  down:  '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v12M7.5 11l4.5 4.5 4.5-4.5M4 20h16"/></svg>',
  cam:   '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5h3.2l1.6-2.3h8.4l1.6 2.3H21v11H3v-11Z"/><circle cx="12" cy="13.8" r="3.4"/></svg>',
  again: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.6h-4.6"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h14M13 6.5l5.5 5.5L13 17.5"/></svg>',
  spark: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 14 9l5.8 2-5.8 2-2 5.8-2-5.8L4.2 11 10 9l2-5.8Z"/></svg>',
  seed:  '<svg viewBox="0 0 24 24"><ellipse cx="8" cy="9" rx="3.6" ry="5" transform="rotate(-28 8 9)"/><ellipse cx="16" cy="10.5" rx="3.4" ry="4.8" transform="rotate(24 16 10.5)"/><ellipse cx="12" cy="17.5" rx="3.5" ry="4.4"/></svg>'
};

/* ---------------------------------------------------------------- content */

const PLAYER_COLORS = ["#3ee8d0", "#a78bfa", "#fbbf24", "#fb7185", "#a3e635", "#60a5fa", "#fb923c"];

const EXPANSIONS = [
  { id: "european", name: "European",
    desc: "New birds, bonus cards and end-of-round goals. Scoring categories are unchanged." },
  { id: "oceania", name: "Oceania",
    desc: "Adds nectar. At game end the most and second-most spent nectar in each habitat scores 5 and 2.",
    adds: "Adds a Nectar round" },
  { id: "asia", name: "Asia",
    desc: "New birds, bonus cards and goals. Duet and Flock modes are not included yet." },
  { id: "americas", name: "Americas",
    desc: "New birds and bonus cards, scored with the standard categories." }
];

// Official scoring order from the game's scorepad.
const BASE_CATS = [
  { id: "birds",  name: "Birds",             short: "Birds",  color: "#3ee8d0", kind: "simple", unit: "points",
    rule: "Points on cards",
    hint: "Add up the points printed in the upper-right corner of every bird card on your player mat." },
  { id: "bonus",  name: "Bonus Cards",       short: "Bonus",  color: "#a78bfa", kind: "simple", unit: "points",
    rule: "As qualified",
    hint: "Reveal your bonus cards and score each one you qualify for. Cards you do not qualify for score nothing." },
  { id: "goals",  name: "End-of-Round Goals", short: "Goals", color: "#fbbf24", kind: "rounds",
    rule: "Goal board placement",
    hint: "Enter the points each player earned on the goal board at the end of each round." },
  { id: "eggs",   name: "Eggs",              short: "Eggs",   color: "#e7edfb", kind: "simple", unit: "count", per: 1,
    rule: "1 point each",
    hint: "1 point per egg sitting on your bird cards." },
  { id: "food",   name: "Food on Cards",     short: "Food",   color: "#fb7185", kind: "simple", unit: "count", per: 1,
    rule: "1 point each",
    hint: "1 point per food token cached on your bird cards." },
  { id: "tucked", name: "Tucked Cards",      short: "Tucked", color: "#60a5fa", kind: "simple", unit: "count", per: 1,
    rule: "1 point each",
    hint: "1 point per card tucked beneath your birds." }
];

const NECTAR_CAT = {
  id: "nectar", name: "Nectar", short: "Nectar", color: "#fb923c", kind: "nectar",
  rule: "5 / 2 per habitat",
  hint: "Count each player's spent nectar in each habitat. Most scores 5, second-most scores 2 — per habitat."
};

/* Built-in house rules. Each one is a toggle on the setup screen and is applied
   wherever its `id` is checked in the scoring logic. */
const HOUSE_RULES = [
  { id: "eightRounds", name: "Eight Rounds", short: "8 rounds",
    desc: "Play 8 rounds instead of 4, dropping a turn each round until you run out. " +
          "The goals step collects 8 entries rather than 4.",
    flag: "8 end-of-round goals" }
];

/* Green-side goal board place points, by round. The 8-round variant repeats the
   round-4 values (7 / 4 / 3) for every round from 4 onwards. */
const PLACE_POINTS = [[4, 1, 0], [5, 2, 1], [6, 3, 2], [7, 4, 3]];

function goalRounds() { return S.rules.eightRounds ? 8 : 4; }

function placePointRef() {
  const n = goalRounds();
  const out = [];
  for (let i = 0; i < Math.min(n, 3); i++) out.push(["R" + (i + 1), PLACE_POINTS[i].join(" / ")]);
  out.push([n > 4 ? "R4&ndash;R" + n : "R4", PLACE_POINTS[3].join(" / ")]);
  return out;
}

/* Not a scoring category — it never adds points. It runs as a final step so the
   reveal can break a tie without ever showing a running total beforehand. */
const TIEBREAK_CAT = {
  id: "tiebreak", name: "Leftover Food", short: "Tiebreak", color: "#a3e635", kind: "tiebreak",
  rule: "Tiebreaker only",
  hint: "Count the food tokens left in each player's personal supply — not the food cached on bird cards. " +
        "This never adds to a score; it only decides the winner if totals end up level."
};

const HABITATS = [
  { id: "forest",    name: "Forest" },
  { id: "grassland", name: "Grassland" },
  { id: "wetland",   name: "Wetland" }
];

const CUSTOM_COLORS = ["#a3e635", "#22d3ee", "#f472b6", "#facc15", "#818cf8", "#4ade80"];

/* ------------------------------------------------------------------ state */

const KEY = "wingspan-scorekeeper-v1";
let S = null;
let uidSeed = 1;

function mkPlayer(i) {
  return { name: "", color: PLAYER_COLORS[i % PLAYER_COLORS.length] };
}

function blankState() {
  return {
    v: 1,
    phase: "setup",          // setup | scoring | reveal
    setupStep: 0,            // 0 expansions, 1 house rules, 2 players
    expansions: { european: false, oceania: false, asia: false, americas: false },
    rules: { eightRounds: false },   // built-in house rules
    custom: [],              // extra house-rule scoring categories
    playerCount: 2,
    players: [0, 1, 2, 3, 4].map(mkPlayer),
    simple: {},              // { catId: { playerIndex: number } }
    goals:  {},              // { playerIndex: [r1,r2,r3,r4] }
    nectar: {},              // { playerIndex: { forest, grassland, wetland } }
    tiebreak: {},            // { playerIndex: leftover food tokens }
    stepIndex: 0,
    revealPlayed: false,
    startedAt: null
  };
}

function save() {
  try { sessionStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode */ }
}
function load() {
  try {
    const raw = sessionStorage.getItem(KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || o.v !== 1) return null;
    o.rules = o.rules || { eightRounds: false };   // forward-compatible defaults
    o.tiebreak = o.tiebreak || {};
    return o;
  } catch (e) { return null; }
}
function reset() {
  try { sessionStorage.removeItem(KEY); } catch (e) {}
  S = blankState();
  save();
}

/* ------------------------------------------------------------- categories */

function categories() {
  const cats = BASE_CATS.map(c => Object.assign({}, c));
  if (S.expansions.oceania) cats.push(Object.assign({}, NECTAR_CAT));

  S.custom.forEach((c, i) => {
    const per = Number(c.per) || 1;
    const cat = {
      id: "hr_" + c.uid,
      name: c.name || "House Rule",
      short: c.name || "House Rule",
      color: CUSTOM_COLORS[i % CUSTOM_COLORS.length],
      kind: "simple",
      unit: per === 1 ? "points" : "count",
      per,
      custom: true,
      rule: per === 1 ? "Points as entered" : (per + " points per " + (c.unitLabel || "unit")),
      hint: per === 1
        ? "House rule category — enter the points each player earned."
        : ("House rule — " + per + " points per " + (c.unitLabel || "unit") + "."),
      unitLabel: c.unitLabel || "unit"
    };
    let at = cats.length;
    if (c.after && c.after !== "end") {
      const f = cats.findIndex(x => x.id === c.after);
      if (f >= 0) at = f + 1;
    }
    cats.splice(at, 0, cat);
  });
  return cats;
}

/** Scoring flow = every scoring category, then the tiebreak step. */
function scoringSteps() { return categories().concat([TIEBREAK_CAT]); }

function nectarPoints() {
  const out = S.players.slice(0, S.playerCount).map(() => 0);
  HABITATS.forEach(h => {
    const vals = out.map((_, i) => Number((S.nectar[i] || {})[h.id]) || 0);
    const ranked = Array.from(new Set(vals.filter(v => v > 0))).sort((a, b) => b - a);
    if (!ranked.length) return;
    const first = ranked[0];
    const firstCount = vals.filter(v => v === first).length;
    vals.forEach((v, i) => { if (v === first) out[i] += 5; });
    // A tie for most consumes the second-place award as well.
    if (firstCount === 1 && ranked.length > 1) {
      const second = ranked[1];
      vals.forEach((v, i) => { if (v === second) out[i] += 2; });
    }
  });
  return out;
}

function catScore(cat, i) {
  if (cat.kind === "nectar") return nectarPoints()[i] || 0;
  if (cat.kind === "rounds") {
    // Slice so entries left behind by a longer variant never leak into the total.
    return (S.goals[i] || []).slice(0, goalRounds()).reduce((a, b) => a + (Number(b) || 0), 0);
  }
  const raw = Number((S.simple[cat.id] || {})[i]) || 0;
  return raw * (cat.per || 1);
}

function rawInput(cat, i) {
  if (cat.kind === "nectar") return null;
  if (cat.kind === "rounds") return (S.goals[i] || []);
  return Number((S.simple[cat.id] || {})[i]) || 0;
}

function totalFor(i) {
  return categories().reduce((sum, c) => sum + catScore(c, i), 0);
}

function activePlayers() {
  return S.players.slice(0, S.playerCount).map((p, i) => ({
    i,
    name: p.name.trim() || ("Player " + (i + 1)),
    color: p.color
  }));
}

function foodFor(i) { return Number(S.tiebreak[i]) || 0; }

function baseRows() {
  return activePlayers().map(p => Object.assign({}, p, { total: totalFor(p.i), food: foodFor(p.i) }));
}

/** Provisional order on points alone — what the chart shows before the tiebreak runs. */
function standingsByTotal() {
  const rows = baseRows();
  rows.sort((a, b) => b.total - a.total || a.i - b.i);
  return rows;
}

/** Runs of two or more players level on points, in a list already sorted by total. */
function tieGroups(rows) {
  const groups = [];
  let run = [rows[0]];
  for (let k = 1; k < rows.length; k++) {
    if (rows[k].total === run[0].total) run.push(rows[k]);
    else { if (run.length > 1) groups.push(run); run = [rows[k]]; }
  }
  if (run.length > 1) groups.push(run);
  return groups;
}

/** Final standings. Ties on points are broken by leftover food; still level is a shared rank. */
function standings() {
  const rows = baseRows();
  rows.sort((a, b) => b.total - a.total || b.food - a.food || a.i - b.i);
  let rank = 0, prevT = null, prevF = null;
  rows.forEach((r, idx) => {
    if (r.total !== prevT || r.food !== prevF) { rank = idx + 1; prevT = r.total; prevF = r.food; }
    r.rank = rank;
    // Level on points with someone, but ahead of them on food.
    r.wonTiebreak = rows.some(o => o !== r && o.total === r.total && o.food < r.food);
  });
  return rows;
}

/** True when the top of the table is shared — level on points *and* on food. */
function sharedVictory() {
  const st = standings();
  return st.length > 1 && st[0].rank === 1 && st[1].rank === 1;
}

function expansionSummary() {
  const on = EXPANSIONS.filter(e => S.expansions[e.id]).map(e => e.name);
  return on.length ? on.join(", ") : "Base game only";
}
function houseRuleSummary() {
  const on = HOUSE_RULES.filter(r => S.rules[r.id]).map(r => r.name)
    .concat(S.custom.map(c => c.name));
  return on.length ? on.join(", ") : "None";
}

/* ------------------------------------------------------------------ toast */

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.hidden = false;
  t.innerHTML = ICON.spark + "<span>" + esc(msg) + "</span>";
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove("show");
    setTimeout(() => { t.hidden = true; }, 450);
  }, 2600);
}

/* ------------------------------------------------------------------ modal */

function dialog(opts) {
  const layer = $("#layer");
  layer.innerHTML =
    '<div class="overlay" data-close="1">' +
      '<div class="dialog" role="dialog" aria-modal="true">' +
        '<div class="ic">' + ICON.warn + '</div>' +
        "<h3>" + esc(opts.title) + "</h3>" +
        "<p>" + opts.body + "</p>" +
        '<div class="row">' +
          '<button class="btn btn-ghost" data-act="cancel">' + esc(opts.cancelText || "Cancel") + "</button>" +
          '<button class="btn ' + (opts.danger ? "btn-danger" : "btn-primary") + '" data-act="ok">' +
            esc(opts.okText || "Confirm") + "</button>" +
        "</div>" +
      "</div>" +
    "</div>";

  const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);

  layer.querySelector('[data-act="cancel"]').onclick = close;
  layer.querySelector('[data-act="ok"]').onclick = () => { close(); opts.onOk(); };
  layer.querySelector(".overlay").onclick = e => { if (e.target.dataset.close) close(); };
  layer.querySelector('[data-act="ok"]').focus();
}

function confirmNewGame() {
  dialog({
    title: "Start a new game?",
    body: "This game&rsquo;s scores will be <b>permanently lost</b>. Nothing is stored anywhere else, so there is no way to get them back. Download the results first if you want to keep them.",
    okText: "Yes, wipe it",
    cancelText: "Keep scoring",
    danger: true,
    onOk: () => { reset(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });
}

   RENDER — root
   ========================================================================= */

const UNIT_LABEL = { birds: "points", bonus: "points", eggs: "eggs", food: "tokens", tucked: "cards" };
const SETUP_STEPS = ["Expansions", "House rules", "Players"];

function render() {
  const app = $("#app");
  app.onkeydown = null;
  $("#newGameTop").hidden = (S.phase === "setup" && S.setupStep === 0);
  renderRail();
  if (S.phase === "setup") renderSetup(app);
  else if (S.phase === "scoring") renderScoring(app);
  else renderReveal(app);
  save();
}

function renderRail() {
  const rail = $("#rail");
  if (S.phase !== "scoring") { rail.innerHTML = ""; return; }
  const cats = scoringSteps();
  rail.innerHTML = cats.map((c, i) =>
    '<button data-jump="' + i + '" class="' +
    (i === S.stepIndex ? "on" : (i < S.stepIndex ? "done" : "")) + '">' + esc(c.short) + "</button>"
  ).join("");
  rail.onclick = e => {
    const b = e.target.closest("[data-jump]");
    if (!b) return;
    S.stepIndex = Number(b.dataset.jump);
    render();
  };
  const cur = rail.querySelector(".on");
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

function setupRailHTML() {
  return '<div class="setup-rail">' + SETUP_STEPS.map((label, i) =>
    (i ? '<span class="bar"></span>' : "") +
    '<button class="s ' + (i === S.setupStep ? "on" : (i < S.setupStep ? "done" : "")) + '" data-sstep="' + i + '">' +
      '<span class="n">' + (i < S.setupStep ? "&#10003;" : (i + 1)) + "</span>" + esc(label) +
    "</button>"
  ).join("") + "</div>";
}

   RENDER — setup
   ========================================================================= */

function renderSetup(app) {
  if (S.setupStep === 0) setupExpansions(app);

  if (rail) rail.onclick = e => {
    const b = e.target.closest("[data-sstep]");

    render();
  };
}

      '<div class="f2">' +

      "<div>Leave <b>points per unit</b> at 1 to type points in straight. Set it higher to count things instead &mdash; " +
      'e.g. 2 points per tucked card becomes &ldquo;2&rdquo; with a unit name of &ldquo;card&rdquo;, and the app does the multiplication.</div></div>' +

    '<div class="actions">' +

      '<button class="btn btn-ghost" data-back>Back</button>' +

  $(".cards", app).onclick = e => {
    const b = e.target.closest("[data-rule]");

  $("[data-go]", app).onclick = () => { S.setupStep = 2; render(); };

function afterLabel(id) {
  if (!id || id === "end") return "everything else";
  const c = categories().find(x => x.id === id);

}

function renderScoring(app) {
  const cats = scoringSteps();
  S.stepIndex = clamp(S.stepIndex, 0, cats.length - 1);
  const cat = cats[S.stepIndex];
  const players = activePlayers();
  const last = S.stepIndex === cats.length - 1;

  let rowsHTML;
  if (cat.kind === "rounds") {
    const nR = goalRounds();
    const stack = nR > 4;
    rowsHTML = players.map(p => {
      const cells = '<div class="rgrid">' + Array.from({ length: nR }, (_, r) =>
        '<div class="rcell"><label>R' + (r + 1) + "</label>" +
          '<div class="rspin">' +
            '<input type="number" inputmode="numeric" min="0" max="99" data-r="' + p.i + "|" + r + '" value="' +
            ((S.goals[p.i] || [])[r] || 0) + '">' +
            '<span class="rbtns">' +
              '<button data-rstep="' + p.i + "|" + r + '|1" aria-label="plus">+</button>' +
              '<button data-rstep="' + p.i + "|" + r + '|-1" aria-label="minus">&minus;</button>' +
            "</span>" +
          "</div></div>"
      ).join("") + "</div>";
      const sum = '<div class="pts" data-sum="' + p.i + '">= <b>' + catScore(cat, p.i) + "</b> pts</div>";
      return stack
        ? '<div class="srow rounds stack">' +
            '<div class="srow-top">' + pnHTML(p) + sum + "</div>" + cells +
          "</div>"
        : '<div class="srow rounds">' + pnHTML(p) + cells + sum + "</div>";
    }).join("");
  } else if (cat.kind === "nectar") {
    const np = nectarPoints();
    rowsHTML = players.map(p =>
      '<div class="srow rounds">' + pnHTML(p) +
        '<div class="rgrid">' + HABITATS.map(h =>
          '<div class="rcell ncell"><label>' + esc(h.name) + "</label>" +
            '<div class="rspin">' +
              '<input type="number" inputmode="numeric" min="0" max="99" data-n="' + p.i + "|" + h.id + '" value="' +
              ((S.nectar[p.i] || {})[h.id] || 0) + '">' +
              '<span class="rbtns">' +
                '<button data-nstep="' + p.i + "|" + h.id + '|1" aria-label="plus">+</button>' +
                '<button data-nstep="' + p.i + "|" + h.id + '|-1" aria-label="minus">&minus;</button>' +
              "</span>" +
            "</div></div>"
        ).join("") + "</div>" +
        '<div class="nectar-badge" data-nb="' + p.i + '">' + np[p.i] + " pts</div>" +

    ).join("");

      '<div class="srow">' + pnHTML(p) +

      "</div>"

  app.innerHTML =
    '<section class="screen">' +
